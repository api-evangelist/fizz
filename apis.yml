aid: fizz
name: Fizz
description: >-
  Fizz is a social platform built for college campuses, connecting students within their own
  school communities across 700+ campuses in the United States. Founded by Stanford students,
  Fizz gives verified students an anonymous, hyper-local feed to find their community and join the
  conversation, buy and sell through Fizz Marketplace, and engage under community values of being
  supportive, curious, honest, and brave. The platform is backed by Lightspeed Venture Partners and
  NEA. Fizz is a consumer mobile social app and does not publish a public developer API, SDKs, or
  API documentation; this API Evangelist profile captures its public web, legal, and security
  surface for network discovery and monitoring.
